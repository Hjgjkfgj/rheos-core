services:
  db:
    image: postgres:16
    container_name: rheos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rheos
    ports:
      - "5432:5432"
    volumes:
      - rheos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rheos_pgdata:
