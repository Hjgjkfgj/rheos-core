name: backup-staging

# Sauvegarde quotidienne chiffrée de la base staging vers Object Storage.
# Secrets requis : DATABASE_URL_ADMIN, BACKUP_ENCRYPTION_KEY, SCW_ACCESS_KEY, SCW_SECRET_KEY.
# Variables : BACKUP_BUCKET (rheos-backups-staging), S3_ENDPOINT (https://s3.fr-par.scw.cloud).
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC chaque jour
  workflow_dispatch: {}      # déclenchement manuel possible

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Client PostgreSQL 17 (pg_dump doit correspondre au serveur Scaleway PG17)
        run: |
          # apt accepte une clé ASCII-armored (.asc) directement via signed-by → PAS de gpg
          # --dearmor (qui tentait d'ouvrir /dev/tty et échouait en CI non-interactif).
          sudo apt-get update && sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/pgdg.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - name: Dump chiffré → bucket
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: bash scripts/backup.sh
